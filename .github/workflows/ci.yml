name: Tests

# Runs on pull requests and pushes to any branch, so PRs get feedback before
# merge (build-and-release.yml only triggers on push to main, which happens
# *after* merge - this is the workflow that actually gates a PR). Its own
# test job runs again as a release gate in build-and-release.yml too; that's
# intentional belt-and-suspenders for the workflow that actually publishes
# binaries, not redundant waste.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: 1.3.14

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build artifacts that are gitignored but required by later steps -
      # order matters. apps/web imports mail-buddy-sdk by its built dist/
      # output (not source), so the SDK must be built before the dashboard.
      # apps/api/src/index.ts imports the generated web-asset manifest, which
      # itself depends on apps/web/dist existing. On a fresh checkout none of
      # these exist yet, so skipping any step here fails typecheck/build with
      # a "Cannot find module" error that looks unrelated to its real cause.
      - name: Build SDK
        run: bun run sdk:build

      - name: Build dashboard
        run: bun run web:build

      - name: Generate embedded web-asset manifest
        run: bun --filter mail-buddy-api generate:web-assets

      - name: Typecheck API
        working-directory: apps/api
        run: bunx tsc --noEmit

      - name: Typecheck SDK
        working-directory: packages/sdk
        run: bunx tsc --noEmit

      - name: Test API
        run: bun run api:test

      - name: Test SDK
        run: bun run sdk:test
