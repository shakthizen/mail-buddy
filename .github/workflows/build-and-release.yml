name: Build and Release

# Two triggers, one pipeline:
#   - push to main            -> rolling "latest" pre-release (tag `latest`),
#                                 replaced on every push, tracks the tip of main.
#   - push of a `v*.*.*` tag  -> a real versioned release (e.g. v0.2.0),
#                                 marked as the repo's "Latest release".
# Tests gate the build either way - a broken run never produces or publishes
# binaries. This only versions the app/binary; the SDK is versioned and
# published independently via sdk-publish.yml on `sdk-v*` tags.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.14

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build artifacts that are gitignored but required by later steps -
      # order matters. apps/web imports mail-buddy-sdk by its built dist/
      # output (not source), so the SDK must be built before the dashboard.
      # apps/api/src/index.ts imports the generated web-asset manifest, which
      # itself depends on apps/web/dist existing. On a fresh checkout none of
      # these exist yet, so skipping any step here fails typecheck/build with
      # a "Cannot find module" error that looks unrelated to its real cause.
      - name: Build SDK
        run: bun run sdk:build

      - name: Build dashboard
        run: bun run web:build

      - name: Generate embedded web-asset manifest
        run: bun --filter mail-buddy-api generate:web-assets

      - name: Typecheck API
        working-directory: apps/api
        run: bunx tsc --noEmit

      - name: Typecheck SDK
        working-directory: packages/sdk
        run: bunx tsc --noEmit

      - name: Test API
        run: bun run api:test

      - name: Test SDK
        run: bun run sdk:test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            name: linux-x64
            outfile: mail-buddy-linux-x64
          - target: bun-linux-arm64
            name: linux-arm64
            outfile: mail-buddy-linux-arm64
          - target: bun-windows-x64
            name: windows-x64
            outfile: mail-buddy-windows-x64.exe
          - target: bun-darwin-x64
            name: macos-x64
            outfile: mail-buddy-macos-x64
          - target: bun-darwin-arm64
            name: macos-arm64
            outfile: mail-buddy-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same build-artifact ordering as the test job above - this is a fresh
      # checkout on its own runner, so it needs the SDK built before the
      # dashboard, and the dashboard built before the web-asset manifest.
      - name: Build SDK
        run: bun run sdk:build

      - name: Build dashboard
        run: bun run web:build

      - name: Generate embedded web-asset manifest
        run: bun --filter mail-buddy-api generate:web-assets

      # Bun cross-compiles `--compile` output for any --target from a single
      # host - no need for per-OS runners.
      - name: Compile binary (${{ matrix.target }})
        working-directory: apps/api
        run: bun build --compile --minify --target=${{ matrix.target }} ./src/index.ts --outfile ../../${{ matrix.outfile }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outfile }}
          path: ${{ matrix.outfile }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten downloaded artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      # A version tag (v0.2.0) gets a real, permanent release marked as
      # "Latest release" on the repo page. A push to main (no tag) updates
      # the rolling `latest` pre-release instead, which never claims that
      # badge - GitHub won't honor make_latest on a prerelease anyway.
      - name: Determine release parameters
        id: params
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "release_name=Mail Buddy ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "Release build of \`${{ github.ref_name }}\` (commit ${{ github.sha }})."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=latest" >> "$GITHUB_OUTPUT"
            echo "release_name=Latest build from main" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "Automatically built from the latest commit on \`main\`: ${{ github.sha }}"
              echo ""
              echo "This is a rolling build, not a tagged version - its binaries are replaced on every push to \`main\`. For a fixed point-in-time build, download from this release now, use a version tag release instead, or build from this specific commit yourself."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.tag_name }}
          name: ${{ steps.params.outputs.release_name }}
          body: ${{ steps.params.outputs.body }}
          prerelease: ${{ steps.params.outputs.prerelease }}
          make_latest: ${{ steps.params.outputs.make_latest }}
          files: release/*
