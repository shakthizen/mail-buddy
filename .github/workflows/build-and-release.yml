name: Build and Release

# Runs on every push to main (direct commits and merged PRs). Tests gate the
# build - a broken main never produces or publishes binaries. Successful
# builds are published to a single rolling "latest" GitHub Release (tag
# `latest`, marked as a pre-release so it never overrides an actual tagged
# version release later), so there's always one place to grab a current
# cross-platform build of main without needing to tag every commit.

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.14

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/api/src/webAssets.generated.ts is gitignored (a build artifact,
      # like apps/web/dist itself) - it must exist before typecheck or the
      # build step, since src/index.ts imports it. Order matters here.
      - name: Build dashboard
        run: bun run web:build

      - name: Generate embedded web-asset manifest
        run: bun --filter mail-buddy-api generate:web-assets

      - name: Typecheck API
        working-directory: apps/api
        run: bunx tsc --noEmit

      - name: Typecheck SDK
        working-directory: packages/sdk
        run: bunx tsc --noEmit

      - name: Test API
        run: bun run api:test

      - name: Test SDK
        run: bun run sdk:test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            name: linux-x64
            outfile: mail-buddy-linux-x64
          - target: bun-linux-arm64
            name: linux-arm64
            outfile: mail-buddy-linux-arm64
          - target: bun-windows-x64
            name: windows-x64
            outfile: mail-buddy-windows-x64.exe
          - target: bun-darwin-x64
            name: macos-x64
            outfile: mail-buddy-macos-x64
          - target: bun-darwin-arm64
            name: macos-arm64
            outfile: mail-buddy-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: bun run web:build

      - name: Generate embedded web-asset manifest
        run: bun --filter mail-buddy-api generate:web-assets

      # Bun cross-compiles `--compile` output for any --target from a single
      # host - no need for per-OS runners.
      - name: Compile binary (${{ matrix.target }})
        working-directory: apps/api
        run: bun build --compile --minify --target=${{ matrix.target }} ./src/index.ts --outfile ../../${{ matrix.outfile }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outfile }}
          path: ${{ matrix.outfile }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten downloaded artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build from main
          body: |
            Automatically built from the latest commit on `main`: ${{ github.sha }}

            This is a rolling pre-release, not a stable version - its binaries are replaced on every push to `main`. For a fixed point-in-time build, download from this release now or build from that specific commit yourself.
          prerelease: true
          make_latest: false
          files: release/*
